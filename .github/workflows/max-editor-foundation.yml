name: MAX EDITOR Android foundation
on:
  push:
    paths:
      - 'max-motion/mobile/**'
      - 'max-motion/contract/kotlin/**'
      - 'max-motion/contract/android/**'
      - 'max-motion/contract/schema/**'
      - 'max-motion/contract/fixtures/**'
      - 'max-motion/contract/tests/**'
      - '.github/workflows/max-editor-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate interchange schema and fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/schema-env"
          "$RUNNER_TEMP/schema-env/bin/pip" install 'jsonschema>=4,<5'
          "$RUNNER_TEMP/schema-env/bin/python" max-motion/contract/tests/schema_test.py
      - name: Compare real browser edit path with contract vectors
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          npm install --prefix "$RUNNER_TEMP/parity" --no-audit --no-fund playwright-core@1.55.0
          # Bind before publishing readiness; scope the HTTP server to this test step.
          python3 -m http.server 8010 --bind 127.0.0.1 --directory docs/max-motion > "$RUNNER_TEMP/parity-http.log" 2>&1 &
          server=$!; trap 'kill "$server"' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8010/ -o /dev/null
          CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/parity/node_modules" node max-motion/contract/tests/web-parity.cjs http://127.0.0.1:8010/
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: max-motion/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
      - run: python3 tool/preflight.py
      - run: flutter pub get && flutter gen-l10n
      - run: flutter analyze && flutter test
      - name: Build the phase-one Android APK
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/android-build.log"; then
            # Publish the relevant Gradle/compiler diagnostic as a check annotation too.
            python3 tool/build_diagnostic.py "$RUNNER_TEMP/android-build.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: max-editor-foundation-debug
          path: |
            max-motion/mobile/build/app/outputs/flutter-apk/app-debug.apk
            max-motion/mobile/pubspec.lock
      - name: Allow the hosted runner to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: max-motion/mobile
          script: |
            flutter test --no-pub integration_test/language_android_test.dart -d emulator-5554
            bash -o pipefail -c 'cd android && ./gradlew :contractCheck:connectedDebugAndroidTest 2>&1 | tee "$RUNNER_TEMP/contract-gradle.log" || { python3 ../tool/build_diagnostic.py "$RUNNER_TEMP/contract-gradle.log"; exit 1; }'
      - name: Verify actual device testcase names
        run: python3 ../contract/tests/check-device-results.py build/contractCheck/outputs/androidTest-results/connected/debug
      - name: Retain contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-contract-android-results
          path: max-motion/mobile/build/contractCheck/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn
