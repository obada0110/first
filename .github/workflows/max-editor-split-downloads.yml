name: Separate Android 0.2.0 downloads
on:
  push:
    branches: ['arena/bff96530-first']
    paths: ['.github/workflows/max-editor-split-downloads.yml']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: android-identity-44912061336
      BUNDLE: MAX-EDITOR-Android-0.2.0-build2.zip
    steps:
      - name: Extract the previously tested files and verify both downloads
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" -p "$BUNDLE"
          unzip -j "$BUNDLE" MAX-EDITOR/apk/MAX-EDITOR.apk MAX-EDITOR/Android-Identity-AR.pdf
          echo '2eec42d8c022ddda1d2c4ef1272173257594307953bd05594a40320e38d14d1a  MAX-EDITOR.apk' | sha256sum -c -
          echo '7f82a381b0ae0075741290bdb4fdfe4572fcf59b70ec3a3492b570ed7116bb43  Android-Identity-AR.pdf' | sha256sum -c -
          zip -q MAX-EDITOR-Report-AR.zip Android-Identity-AR.pdf
          unzip -tqq MAX-EDITOR-Report-AR.zip
          test "$(unzip -Z1 MAX-EDITOR-Report-AR.zip)" = Android-Identity-AR.pdf
          gh release upload "$TAG" MAX-EDITOR.apk MAX-EDITOR-Report-AR.zip
          gh release download "$TAG" -p MAX-EDITOR.apk -p MAX-EDITOR-Report-AR.zip -D verified
          cmp MAX-EDITOR.apk verified/MAX-EDITOR.apk
          cmp MAX-EDITOR-Report-AR.zip verified/MAX-EDITOR-Report-AR.zip
