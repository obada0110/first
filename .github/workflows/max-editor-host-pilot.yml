name: Integrated editors - isolated KMP pilot
on:
  push:
    branches: ['arena/bff96530-first']
    paths: ['experiments/editor-pilot/**','.github/workflows/max-editor-host-pilot.yml']
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: experiments/editor-pilot
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.38.3', channel: stable}
      - name: Compile shared source and materialize isolated copies
        run: |
          set -euo pipefail
          git diff --exit-code 9fba216 HEAD -- ../../max-motion ../../docs ../../experiments/max-core-kmp ../../experiments/max-integration
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y ffmpeg; }
          export PILOT_DIR="$RUNNER_TEMP/host-pilot";echo "PILOT_DIR=$PILOT_DIR" >> "$GITHUB_ENV"
          mkdir -p proof/records
          bash build.sh 2>&1 | tee proof/records/build.log
      - name: Test browser editor, its IndexedDB and transfer output
        run: |
          export NODE_PATH="$RUNNER_TEMP/pilot-node/node_modules"; node "$NODE_PATH/playwright-core/cli.js" install --with-deps firefox webkit > /dev/null
          W="$PILOT_DIR/max-motion";R="$PWD/proof/records";python tests/serve.py "$W" "$R" >"$R/desktop-http.log" 2>&1 & server=$!;trap 'kill "$server"' EXIT
          node tests/desktop.cjs "$W" "$R" outbound 2>&1 |tee "$R/desktop.log" && python tests/verify.py "$R" chromium firefox webkit
      - name: Build actual Flutter host under lab application ID
        run: |
          R="$PWD/proof/records"; cd "$PILOT_DIR/max-motion/mobile"; flutter pub get && flutter gen-l10n && flutter build apk --debug 2>&1 |tee "$R/apk.log"
          cp build/app/outputs/flutter-apk/app-debug.apk "$PILOT_DIR/ordinary-pilot.apk"
          ffmpeg -v error -i "$PILOT_DIR/max-motion/pilot.webm" -c:v libx264 -pix_fmt yuv420p "$PILOT_DIR/max-motion/mx-land.mp4"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/upload-artifact@v6
        with:
          name: host-pilot-debug-apk
          path: ${{ runner.temp }}/host-pilot/max-motion/mobile/build/app/outputs/flutter-apk/app-debug.apk
      - name: Exercise Flutter route, real Android WebView and return to web
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: env RUN_PAUSED_PROBE=1 bash experiments/editor-pilot/tests/device.sh
      - name: Keep built core and browser fixture (no device SDK or user data)
        if: always()
        run: |
          mkdir -p proof/binaries
          W="$PILOT_DIR/max-motion"; for f in core-pilot.mjs pilot.webm mobile/android/app/libs/core-pilot.jar;do test ! -f "$W/$f" || cp "$W/$f" proof/binaries;done
      - if: always()
        uses: actions/upload-artifact@v6
        with: {name: host-pilot-evidence, path: experiments/editor-pilot/proof}
      - name: Export evidence for the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p proof/records; cd proof
          zip -qr "$RUNNER_TEMP/proof.zip" .
          sha=$(python3 -c 'import sys,json,base64;print(json.dumps({"encoding":"base64","content":base64.b64encode(open(sys.argv[1],"rb").read()).decode()}))' "$RUNNER_TEMP/proof.zip" | gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
          echo "::notice title=Experiment evidence::$sha"
