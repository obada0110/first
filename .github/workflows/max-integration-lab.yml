name: MAX Phase 2 isolated integration
on:
  push:
    branches: ['arena/bff96530-first']
    paths: ['experiments/max-integration/**', '.github/workflows/max-integration-lab.yml']
permissions:
  contents: read
jobs:
  transfer:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: experiments/max-integration
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify frozen product and Phase 1 core
        run: git diff --exit-code 8b02a0156cb62794b8324642cbf1c12f5d1e8bea HEAD -- ../../max-motion ../../docs ../max-core-kmp
      - name: Build independent web and Android hosts
        run: |
          mkdir -p proof/records
          bash build.sh 2>&1 | tee proof/records/build.log || { echo "::error title=Build::$(tail -40 proof/records/build.log | tr '\n' ' ')"; exit 1; }
      - name: Install two additional browser engines
        run: node "$RUNNER_TEMP/max-integration-tools/node_modules/playwright-core/cli.js" install --with-deps firefox webkit
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Bidirectional artifact handoff with native lab Activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          working-directory: experiments/max-integration
          script: |
            adb install proof/android/transfer-lab.apk
            bash -o pipefail -c 'NODE_PATH="$RUNNER_TEMP/max-integration-tools/node_modules" node tests/transfer.cjs 2>&1 | tee proof/records/transfer.log'
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-proof
          path: experiments/max-integration/proof
      - name: Export evidence for the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p proof/records; cd proof
          zip -qr "$RUNNER_TEMP/proof.zip" .
          sha=$(python3 -c 'import sys,json,base64;print(json.dumps({"encoding":"base64","content":base64.b64encode(open(sys.argv[1],"rb").read()).decode()}))' "$RUNNER_TEMP/proof.zip" | gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')
          echo "::notice title=Experiment evidence::$sha"
