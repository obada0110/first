name: MAX EDITOR production-core integration gate
on:
  push:
    branches: ['arena/bff96530-first']
    paths:
      - 'max-motion/core-kmp/**'
      - 'max-motion/mobile/**'
      - 'max-motion/contract/**'
      - 'experiments/max-core-kmp/**'
      - '.github/workflows/max-editor-production-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.38.3', channel: stable}
      - name: Preserve v1 schema, old channel, production surfaces and production path allowlist
        run: |
          set -euo pipefail
          git diff --exit-code 9fba216f7652eb7bef580ddd6b9a30da0283aefa HEAD -- max-motion/contract/schema max-motion/docs max-motion/index.html max-motion/editor.js max-motion/studio.js docs
          test "$(grep -c 'max_editor/single/v1' max-motion/mobile/android/app/src/main/kotlin/io/github/obada0110/maxeditor/single/SingleChannel.kt)" -eq 1
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only','9fba216f7652eb7bef580ddd6b9a30da0283aefa','HEAD','--','max-motion']).decode().splitlines()
          allowed=('max-motion/mobile/android/settings.gradle.kts','max-motion/mobile/android/build.gradle.kts','max-motion/mobile/android/app/build.gradle.kts','max-motion/mobile/android/app/src/main/kotlin/io/github/obada0110/maxeditor/single/SingleChannel.kt','max-motion/mobile/android/app/src/main/kotlin/io/github/obada0110/maxeditor/single/Source.kt','max-motion/mobile/android/app/src/main/kotlin/io/github/obada0110/maxeditor/single/ProductionProjectSession.kt','max-motion/mobile/lib/features/single/single_screen.dart','max-motion/mobile/lib/features/single/project_library.dart','max-motion/mobile/lib/l10n/app_ar.arb','max-motion/mobile/lib/l10n/app_en.arb','max-motion/mobile/integration_test/core_edit_android_test.dart','max-motion/mobile/tool/core_qa/','max-motion/ANDROID-STATUS-REPORT-AR.md','max-motion/web/')
          allowed=allowed+('max-motion/core-kmp/',)
          bad=[n for n in names if not any(n==a or n.startswith(a) for a in allowed)]
          assert not bad,bad
          from pathlib import Path
          for archived in Path('max-motion/web').rglob('*'):
            if archived.is_file() and archived.name!='README.md':
              source=Path('max-motion')/archived.relative_to('max-motion/web')
              assert source.is_file() and source.read_bytes()==archived.read_bytes(),f'web snapshot drift: {archived}'
          PY
          cmp experiments/max-core-kmp/fixtures/project-v1.json max-motion/contract/schema/project-v1.json
      - name: Flutter analysis and unit tests
        working-directory: max-motion/mobile
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          if ! flutter analyze 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"; then
            python3 tool/core_qa/ci_diagnostic.py "$RUNNER_TEMP/flutter-analyze.log" "Flutter analyze"
            exit 1
          fi
          if ! flutter test 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"; then
            python3 tool/core_qa/ci_diagnostic.py "$RUNNER_TEMP/flutter-test.log" "Flutter tests"
            exit 1
          fi
      - name: Build default debug app; verify feature flag is off
        working-directory: max-motion/mobile
        run: |
          set -euo pipefail
          if ! flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/android-legacy-build.log"; then
            python3 tool/build_diagnostic.py "$RUNNER_TEMP/android-legacy-build.log"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/max-editor-legacy-debug.apk"
          python3 - <<'PY'
          from pathlib import Path
          config = Path('build/app/generated/source/buildConfig/debug/io/github/obada0110/maxeditor/BuildConfig.java').read_text()
          assert 'MAX_CORE_EDITOR_ENABLED = false' in config, config
          PY
      - name: Build isolated core-enabled debug APK; release configuration remains disabled
        working-directory: max-motion/mobile
        env:
          ORG_GRADLE_PROJECT_maxCoreEditorEnabled: 'true'
        run: |
          set -euo pipefail
          if ! flutter build apk --debug 2>&1 | tee "$RUNNER_TEMP/android-core-build.log"; then
            python3 tool/build_diagnostic.py "$RUNNER_TEMP/android-core-build.log"
            exit 1
          fi
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/MAX-EDITOR-Phase-3A-Core-Debug.apk"
          python3 - <<'PY'
          from pathlib import Path
          config = Path('build/app/generated/source/buildConfig/debug/io/github/obada0110/maxeditor/BuildConfig.java').read_text()
          assert 'MAX_CORE_EDITOR_ENABLED = true' in config, config
          PY
      - name: Install media fixture generator
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Allow KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Exercise production screen, durable v1 edits, preview, rotation and cold reopen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ORG_GRADLE_PROJECT_maxCoreEditorEnabled: 'true'
        with:
          api-level: 35
          arch: x86_64
          working-directory: max-motion/mobile
          script: bash tool/core_qa/device.sh
      - name: Retain the review APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: max-editor-phase-3a-review
          path: |
            ${{ runner.temp }}/MAX-EDITOR-Phase-3A-Core-Debug.apk
            ${{ runner.temp }}/max-editor-legacy-debug.apk
            ${{ runner.temp }}/core-qa/evidence/**
            ${{ runner.temp }}/single-qa/evidence/**
            max-motion/mobile/integration_test/core_edit_android_test.dart
            max-motion/mobile/tool/core_qa/**
