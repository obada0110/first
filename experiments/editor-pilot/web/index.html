<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX · اختبار المحرر</title><p>مشروع اصطناعي فقط. هذه نافذة المحرر الحالي مع مسار أوامر تجريبي. <a href="./index.html">فتح المسار القديم المعزول</a></p><nav id="ops"></nav><output id="status">جارٍ فتح العينة</output><iframe inert title="محرر MAX" style="width:100%;height:76vh;border:0" src="index.html?pilot=1"></iframe><script type="module">
const frame=document.querySelector('iframe'); const labels={add:'إضافة مقطع من الأصل',trim:'قص نهاية المقدمة',split:'تقسيم cA',delete:'حذف المقطع الإضافي',order:'عكس ترتيب الطبقات',undo:'تراجع',redo:'إعادة',left:'قص بداية المقدمة'};
for(const [key,label] of Object.entries(labels)){const b=document.createElement('button');b.id=key;b.textContent=label;ops.append(b);b.onclick=()=>{try{const r=frame.contentWindow.pilot.action(key);statusOut(r.ok?'revision '+r.revision:r.error)}catch(e){statusOut(e.message)}}}function statusOut(x){document.querySelector('output').textContent=x}
for(const [key,label] of [['save','حفظ اللقطة التجريبية'],['restore','استعادة اللقطة']]){const b=document.createElement('button');b.id=key;b.textContent=label;ops.append(b);b.onclick=async()=>{try{await frame.contentWindow.pilot[key]();statusOut(key)}catch(e){statusOut(e.message)}}}
window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.origin===location.origin)statusOut(String(e.data))});
</script></html>
